[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-nba"
version = "0.1.0"
description = "Churn early-warning (survival + sequence) and Next-Best-Action (contextual bandits) for digital banking"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "scipy>=1.11",
  "lifelines>=0.28", "joblib>=1.3", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6",
]

[project.optional-dependencies]
seq = ["torch>=2.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
